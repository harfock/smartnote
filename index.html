<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"/>
<title>智醒長者・自由空間數位照護日誌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  /* Solar Atmospheric Tokens - High Contrast Cataract Friendly */
  --bg-surface: #FAF8F5;
  --bg-card: #FFFFFF;
  --text-main: #0F172A;
  --text-muted: #334155;
  --border-color: #0F172A;
  --accent-gold: #D97706;
  --accent-gold-bg: #FEF3C7;
  --accent-blue: #1E40AF;
  --accent-blue-bg: #EFF6FF;
  --accent-green: #047857;
  --accent-green-bg: #D1FAE5;
  --accent-red: #B91C1C;
  --accent-red-bg: #FEE2E2;
  --accent-purple: #7C3AED;
  --accent-purple-bg: #F3E8FF;
  
  --shadow-elevation: 0 8px 24px -4px rgba(0, 0, 0, 0.16), 0 4px 6px -2px rgba(0, 0, 0, 0.08);
  --shadow-active: 0 18px 36px -6px rgba(0, 0, 0, 0.3);
  
  --font-serif: 'Noto Serif TC', serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Fluid Responsive Card Sizing Token */
  --widget-width: clamp(280px, 92vw, 360px);
  
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

body.theme-night {
  --bg-surface: #0B0F17;
  --bg-card: #151D2A;
  --text-main: #F8FAFC;
  --text-muted: #CBD5E1;
  --border-color: #475569;
  --shadow-elevation: 0 8px 24px -4px rgba(0, 0, 0, 0.7);
}

html, body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  overflow: hidden;
  background-color: var(--bg-surface);
  color: var(--text-main);
  font-family: var(--font-serif);
  touch-action: none;
  transition: background-color 0.8s ease;
}

.svg-icon {
  display: inline-block;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  vertical-align: middle;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

#ambient-edge-strobe {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  box-shadow: inset 0 0 0 0px transparent;
  transition: box-shadow 0.4s ease;
}

#app-root {
  display: flex;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

/* Off-canvas Responsive Sidebar Drawer */
#sidebar-dock {
  width: 290px;
  max-width: 85vw;
  background: var(--bg-card);
  border-right: 3.5px solid var(--border-color);
  display: flex;
  flex-direction: column;
  z-index: 4000;
  box-shadow: 6px 0 20px rgba(0,0,0,0.2);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
  user-select: none;
  position: relative;
}

@media (max-width: 768px) {
  #sidebar-dock {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    height: 100%;
    transform: translateX(-100%);
  }
  #sidebar-dock.open {
    transform: translateX(0);
  }
}

@media (min-width: 769px) {
  #sidebar-dock.collapsed {
    transform: translateX(-290px);
    margin-right: -290px;
  }
}

#sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(3px);
  z-index: 3900;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#sidebar-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

.dock-header {
  padding: 14px 16px;
  background: #0F172A;
  color: #FFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--border-color);
}

.dock-title {
  font-size: 1.05rem;
  font-weight: 900;
  color: #FBBF24;
}

.dock-toggle-btn {
  background: #334155;
  color: #FFF;
  border: 2px solid #FBBF24;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  font-weight: 900;
}

.dock-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

.btn-primary-add {
  background: var(--accent-gold);
  color: #FFFFFF;
  border: 3px solid var(--border-color);
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 900;
  font-size: 0.95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  white-space: nowrap;
}

.btn-primary-add:active {
  transform: scale(0.97);
  background: #B45309;
}

.dock-section-title {
  font-size: 0.82rem;
  font-family: var(--font-sans);
  font-weight: 900;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 2px solid rgba(0,0,0,0.12);
  padding-bottom: 4px;
}

.quick-stickers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.sticker-btn {
  background: var(--bg-surface);
  border: 2.5px solid var(--border-color);
  border-radius: 10px;
  padding: 10px 6px;
  font-size: 0.85rem;
  font-weight: 900;
  color: var(--text-main);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}

.sticker-btn:active {
  background: var(--accent-gold-bg);
  border-color: var(--accent-gold);
}

#main-canvas {
  flex: 1;
  position: relative;
  overflow: hidden;
  background-image: 
    radial-gradient(circle at 1px 1px, rgba(0,0,0,0.12) 1px, transparent 0);
  background-size: 28px 28px;
  width: 100%;
  height: 100%;
  cursor: grab;
}

#main-canvas:active {
  cursor: grabbing;
}

body.theme-night #main-canvas {
  background-image: 
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.12) 1px, transparent 0);
}

.canvas-top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2500;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(250, 248, 245, 0.88);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid rgba(0,0,0,0.08);
  flex-wrap: nowrap;
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
}

body.theme-night .canvas-top-bar {
  background: rgba(11, 15, 23, 0.88);
}

.instruction-guide-banner {
  background: #0F172A;
  color: #FBBF24;
  border: 2px solid #FBBF24;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.8rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-elevation);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#widgets-container {
  position: absolute;
  width: 5000px;
  height: 5000px;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  transition: transform 0.05s ease-out;
  pointer-events: none;
}

#widgets-container .canvas-widget {
  pointer-events: auto;
}

.canvas-widget {
  position: absolute;
  width: var(--widget-width);
  max-width: calc(100vw - 20px);
  background: var(--bg-card);
  border: 3.5px solid var(--border-color);
  border-radius: 16px;
  box-shadow: var(--shadow-elevation);
  display: flex;
  flex-direction: column;
  z-index: 10;
  touch-action: none;
  user-select: none;
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
  will-change: transform, left, top;
  cursor: grab;
}

.canvas-widget:active {
  cursor: grabbing;
}

.canvas-widget.dragging {
  box-shadow: var(--shadow-active);
  border-color: var(--accent-gold);
  z-index: 3000 !important;
}

.canvas-widget.type-meds { border-left: 10px solid var(--accent-red); }
.canvas-widget.type-clinic { border-left: 10px solid var(--accent-blue); }
.canvas-widget.type-note { border-left: 10px solid var(--accent-green); }
.canvas-widget.type-clock { border-left: 10px solid var(--accent-gold); }
.canvas-widget.type-todo { border-left: 10px solid var(--accent-green); }
.canvas-widget.type-media { border-left: 10px solid var(--accent-purple); }

.widget-header {
  padding: 8px 10px;
  background: rgba(0,0,0,0.04);
  border-bottom: 2px solid rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: move;
}

.widget-category-tag {
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: 0.75rem;
  padding: 3px 8px;
  border-radius: 6px;
  color: #FFF;
  white-space: nowrap;
}

.type-meds .widget-category-tag { background: var(--accent-red); }
.type-clinic .widget-category-tag { background: var(--accent-blue); }
.type-note .widget-category-tag { background: var(--accent-green); }
.type-clock .widget-category-tag { background: var(--accent-gold); }
.type-todo .widget-category-tag { background: var(--accent-green); }
.type-media .widget-category-tag { background: var(--accent-purple); }

.widget-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}

.widget-btn {
  background: rgba(0,0,0,0.06);
  border: 1.5px solid var(--border-color);
  color: var(--text-main);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  font-weight: 900;
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 3px;
}

.widget-btn:active {
  background: var(--accent-gold-bg);
  border-color: var(--accent-gold);
}

.widget-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.widget-time-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: 0.95rem;
  color: var(--accent-gold);
}

.widget-content-text {
  font-weight: 900;
  line-height: 1.25;
  color: var(--text-main);
  word-break: break-all;
  white-space: pre-wrap;
  letter-spacing: 0.02em;
}

/* To-Do List Card Specific Styles */
.todo-items-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}

.todo-item-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--bg-surface);
  border: 2px solid var(--border-color);
  border-radius: 10px;
  cursor: pointer;
}

.todo-item-row.completed {
  opacity: 0.65;
  background: rgba(0,0,0,0.02);
}

.todo-checkbox {
  width: 24px;
  height: 24px;
  border: 2.5px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.todo-item-row.completed .todo-checkbox {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: #FFF;
}

.todo-item-text {
  font-size: 1rem;
  font-weight: 900;
  color: var(--text-main);
  word-break: break-all;
  flex: 1;
}

.todo-item-row.completed .todo-item-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

/* Media Card Specific Styles */
.media-thumbnail-container {
  width: 100%;
  height: 140px;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid var(--border-color);
  background: #000;
  position: relative;
}

.media-thumbnail-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.media-link-badge {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  background: var(--accent-purple-bg);
  border: 2px solid var(--accent-purple);
  border-radius: 10px;
  color: var(--accent-purple);
  font-weight: 900;
  font-size: 0.9rem;
  text-decoration: none;
  cursor: pointer;
}

.ack-button {
  width: 100%;
  height: 48px;
  background: var(--accent-gold-bg);
  border: 3px solid var(--accent-gold);
  border-radius: 10px;
  color: var(--accent-gold);
  font-weight: 900;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.ack-button.acknowledged {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: #FFFFFF;
}

.canvas-widget.collapsed-mode {
  padding: 2px;
}

.collapsed-pill-box {
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
}

.collapsed-pill-title {
  font-weight: 900;
  font-size: 1.05rem;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}

.widget-footer-stamp {
  padding: 8px 12px;
  border-top: 2px dashed rgba(0,0,0,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 800;
}

.author-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--border-color);
  color: #FFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 900;
}

.clock-display-main {
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: clamp(2.5rem, 8vw, 3.6rem);
  line-height: 1;
  color: var(--text-main);
  text-align: center;
  margin: 4px 0;
  font-variant-numeric: tabular-nums;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 9000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: var(--bg-card);
  border: 4px solid var(--border-color);
  border-radius: 18px;
  width: min(520px, 94vw);
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-active);
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 14px;
  background: #0F172A;
  color: #FFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3.5px solid var(--border-color);
}

.modal-title {
  font-size: 1.05rem;
  font-weight: 900;
  color: #FBBF24;
}

.modal-close-btn {
  background: #334155;
  color: #FFF;
  border: 2px solid #FBBF24;
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
  font-weight: 900;
}

.modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-weight: 900;
  font-size: 0.9rem;
  color: var(--text-main);
}

.form-input, .form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 3px solid var(--border-color);
  border-radius: 10px;
  background: var(--bg-surface);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 800;
  outline: none;
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.form-type-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.type-option-btn {
  border: 2.5px solid var(--border-color);
  border-radius: 8px;
  padding: 8px 4px;
  background: var(--bg-surface);
  color: var(--text-main);
  font-weight: 900;
  font-size: 0.8rem;
  cursor: pointer;
  text-align: center;
}

.type-option-btn.selected {
  background: var(--border-color);
  color: #FFF;
}

#toast-notification {
  position: fixed;
  top: clamp(60px, 10vh, 80px);
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #0F172A;
  color: #FBBF24;
  border: 3px solid #FBBF24;
  border-radius: 30px;
  padding: 8px 20px;
  font-weight: 900;
  font-size: 0.92rem;
  box-shadow: 0 12px 24px rgba(0,0,0,0.35);
  z-index: 10000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}

#toast-notification.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div id="app-root">

  <div id="ambient-edge-strobe"></div>
  <div id="toast-notification">備忘錄已更新 ‧ UPDATED</div>
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

  <!-- SIDEBAR TOOL DOCK -->
  <aside id="sidebar-dock">
    <div class="dock-header">
      <span class="dock-title">工具箱 TOOLBOX</span>
      <button class="dock-toggle-btn" id="dockToggleBtn" onclick="toggleSidebar(false)">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="dock-body">
      <button class="btn-primary-add" onclick="openAddNoteModal()">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>新增自訂叮囑 ‧ ADD</span>
      </button>

      <div class="dock-section-title">快捷貼紙 ‧ 1-TAP STICKERS</div>
      <div class="quick-stickers-grid">
        <button class="sticker-btn" onclick="spawnQuickSticker('water')">
          <svg class="svg-icon" style="color: var(--accent-blue);" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <span>記得飲水 💧</span>
        </button>
        <button class="sticker-btn" onclick="spawnQuickSticker('dinner')">
          <svg class="svg-icon" style="color: var(--accent-gold);" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
          <span>返嚟食飯 🍚</span>
        </button>
        <button class="sticker-btn" onclick="spawnQuickSticker('clothes')">
          <svg class="svg-icon" style="color: var(--accent-red);" viewBox="0 0 24 24"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          <span>天冷穿衣 🧥</span>
        </button>
        <button class="sticker-btn" onclick="spawnQuickSticker('bp')">
          <svg class="svg-icon" style="color: var(--accent-green);" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>量度血壓 🩺</span>
        </button>
      </div>

      <div class="dock-section-title">排版整理 ‧ ORGANIZE</div>
      <button class="sticker-btn" style="width: 100%; font-size: 0.9rem; padding: 10px; background: var(--accent-gold-bg); border-color: var(--accent-gold); color: var(--accent-gold);" onclick="resetCardArrangement()">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>🔄 自動重設排列卡片 (RESET GRID)</span>
      </button>

      <button class="sticker-btn" style="width: 100%; font-size: 0.9rem; padding: 10px; margin-top: 4px;" onclick="toggleCollapseAll()">

<script>
'use strict';

let canvasScale = 1.0;
let panX = 100;
let panY = 80;

let initialPinchDistance = null;

const DEFAULT_WIDGETS = [

function loadWidgetsFromStorage() {
  try {
    const saved = localStorage.getItem('care_canvas_widgets_v7');
    if (saved) {
      widgetsState = JSON.parse(saved);
    } else {
      widgetsState = JSON.parse(JSON.stringify(DEFAULT_WIDGETS));
    }
  } catch(e) {
    widgetsState = JSON.parse(JSON.stringify(DEFAULT_WIDGETS));
  }

  try {
    const savedChars = localStorage.getItem('care_canvas_chars_per_line');
    if (savedChars) {
      charsPerLine = parseInt(savedChars, 10) || 8;
    }
  } catch(e) {
    charsPerLine = 8;
  }
  updateCharsPerLineDisplay();
}

function updateCharsPerLineDisplay() {
  const el = document.getElementById('chars-per-line-val');
  if (el) el.textContent = charsPerLine;
}

function changeCharsPerLine(delta) {
  charsPerLine = Math.max(3, Math.min(20, charsPerLine + delta));
  try {
    localStorage.setItem('care_canvas_chars_per_line', charsPerLine.toString());
  } catch(e) {}
  updateCharsPerLineDisplay();
  renderAllWidgets();
  updateModalLivePreview();
  showToast(`每行字數已設定為 ${charsPerLine} 字 (自動放大字型)`);
}

function escapeHTML(str) {
  return String(str || '')
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatContentWithDynamicFont(text, maxChars, cardWidthPx) {
  if (!text) return { html: '', fontSize: '32px' };
  const limit = maxChars || 8;
  const width = cardWidthPx || 320;
  
  const availableWidth = width - 24;
  let calculatedFontSizePx = Math.floor(availableWidth / (limit * 0.95));
  calculatedFontSizePx = Math.max(22, Math.min(52, calculatedFontSizePx));

  const lines = String(text).split('\n');
  const formatted = lines.map(line => {
    let result = '';
    const cleanLine = line.replace(/\s+/g, '');
    for (let i = 0; i < cleanLine.length; i += limit) {
      const chunk = cleanLine.slice(i, i + limit);
      result += escapeHTML(chunk);
      if (i + limit < cleanLine.length) {
        result += '<br>';
      }
    }
    return result;
  });

  return {
    html: formatted.join('<br>'),
    fontSize: `${calculatedFontSizePx}px`
  };
}

function updateCanvasTransform() {
  const container = document.getElementById('widgets-container');
  if (container) {
    container.style.transform = `translate(${panX}px, ${panY}px) scale(${canvasScale})`;
  }
  const indicator = document.getElementById('zoom-level-indicator');
  if (indicator) indicator.textContent = `${Math.round(canvasScale * 100)}%`;
}

function resetZoom() {
  canvasScale = 1.0;
  panX = 40;
  panY = 70;
  updateCanvasTransform();
  showToast('畫面縮放與中心已重置 ‧ ZOOM RESET');
}

function resetCardArrangement() {
  const startX = 40;
  const startY = 80;
  const colWidth = 370;
  const rowHeight = 380;
  const maxCols = 3;

  widgetsState.forEach((w, index) => {
    const col = index % maxCols;
    const row = Math.floor(index / maxCols);
    w.x = startX + col * colWidth;
    w.y = startY + row * rowHeight;
    w.collapsed = false;
  });

  panX = 20;
  panY = 70;
  canvasScale = 1.0;
  saveWidgetsToStorage();
  renderAllWidgets();
  updateCanvasTransform();
  showToast('卡片已自動整齊排列 ‧ GRID RESET');
}

function saveWidgetsToStorage() {
  try {
    localStorage.setItem('care_canvas_widgets_v7', JSON.stringify(widgetsState));
  } catch(e) {
    console.warn('LocalStorage save skipped', e);
  }
}

function renderAllWidgets() {
  const container = document.getElementById('widgets-container');
  container.innerHTML = '';

  widgetsState.forEach(w => {
    const el = createWidgetDOM(w);
    container.appendChild(el);
    initDraggableWidget(el);
  });

  updateClock();
}

function createWidgetDOM(w) {
  const card = document.createElement('div');
  card.id = w.id;
  card.style.left = `${w.x}px`;
  card.style.top = `${w.y}px`;

  card.addEventListener('pointerdown', (e) => bringToFront(card));

  if (w.type === 'clock') {
    card.className = `canvas-widget type-clock ${w.collapsed ? 'collapsed-mode' : ''}`;
    if (w.collapsed) {
      card.innerHTML = `
        <div class="collapsed-pill-box" onclick="toggleCardCollapse('${w.id}')">
          <div style="display:flex; align-items:center; gap:6px;">
            <svg class="svg-icon" style="color:var(--accent-gold);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="collapsed-pill-title">🕒 智醒大時鐘</span>
          </div>
          <button class="widget-btn">展開</button>
        </div>
      `;
    } else {
      card.innerHTML = `
        <div class="widget-header">
          <span class="widget-category-tag">CLOCK ‧ 時鐘</span>
          <div class="widget-controls">
            <button class="widget-btn" onclick="toggleCardCollapse('${w.id}')">折疊</button>

          <div style="margin-top: 10px; padding: 8px 6px; background: rgba(0,0,0,0.03); border: 2.5px solid var(--border-color); border-radius: 12px; text-align: center;">
            <div style="font-size: 0.76rem; font-family: var(--font-sans); font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px;">
              晝夜太陽軌跡 ‧ SOLAR ARC OF THE DAY
            </div>
            <svg id="solar-arc-svg" viewBox="0 0 300 115" style="width: 100%; max-width: 280px; height: auto; overflow: visible; display: block; margin: 0 auto;">
              <line x1="15" y1="85" x2="285" y2="85" stroke="var(--border-color)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
              <path id="day-arc-path" d="M 30 85 A 120 70 0 0 1 270 85" fill="none" stroke="var(--accent-gold)" stroke-width="3.5" stroke-linecap="round"/>
              <path id="night-arc-path" d="M 270 85 A 120 25 0 0 1 30 85" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
              
              <g id="solar-indicator-group">
                <circle id="solar-indicator-glow" cx="30" cy="85" r="13" fill="#FBBF24" opacity="0.45"/>
                <circle id="solar-indicator-core" cx="30" cy="85" r="7.5" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
              </g>

              <circle cx="30" cy="85" r="3.5" fill="var(--text-main)"/>
              <text x="30" y="103" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="900" fill="var(--text-main)">06:00 晨</text>

              <circle cx="150" cy="15" r="3.5" fill="var(--accent-gold)"/>
              <text x="150" y="103" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="900" fill="var(--accent-gold)">12:00 午</text>

              ☀️ 早上 ‧ Morning

          </div>
        </div>
      `;
    }
    return card;
  }

  let tagTitle = 'MESSAGE ‧ 叮囑';
  let categoryClass = 'type-note';
  let badgeIcon = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

  if (w.type === 'meds') {

  // Specific rendering for To-Do List Template

    const newWidget = {

      type: selectedNoteType,

      content: content,
      author: author,

let activeWidget = null;
let startX = 0, startY = 0;
let initialLeft = 0, initialTop = 0;

function initDraggableWidget(widgetEl) {
  widgetEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, input, textarea, a, select')) return;

    activeWidget = widgetEl;
    bringToFront(activeWidget);
    activeWidget.classList.add('dragging');

    startX = e.clientX;
    startY = e.clientY;

    const targetState = widgetsState.find(w => w.id === widgetEl.id);
    if (targetState) {
      initialLeft = targetState.x;
      initialTop = targetState.y;
    }

    widgetEl.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });

  widgetEl.addEventListener('pointermove', (e) => {
    if (!activeWidget || activeWidget !== widgetEl) return;

    const dx = (e.clientX - startX) / canvasScale;
    const dy = (e.clientY - startY) / canvasScale;

    const newLeft = initialLeft + dx;
    const newTop = initialTop + dy;

    activeWidget.style.left = `${newLeft}px`;
    activeWidget.style.top = `${newTop}px`;

    const targetState = widgetsState.find(w => w.id === widgetEl.id);
    if (targetState) {
      targetState.x = newLeft;
      targetState.y = newTop;
    }
  });

  const endDrag = (e) => {
    if (activeWidget === widgetEl) {
      activeWidget.classList.remove('dragging');
      activeWidget = null;
      saveWidgetsToStorage();
    }
  };

  widgetEl.addEventListener('pointerup', endDrag);
  widgetEl.addEventListener('pointercancel', endDrag);
}

function initCanvasPanAndZoom() {
  const canvas = document.getElementById('main-canvas');

  canvas.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.canvas-widget, .canvas-top-bar, #sidebar-dock, .modal-backdrop')) return;
    isPanningCanvas = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isPanningCanvas) return;
    panX = e.clientX - panStartX;
    panY = e.clientY - panStartY;
    updateCanvasTransform();
  });

  const endPan = (e) => {
    isPanningCanvas = false;
  };
  canvas.addEventListener('pointerup', endPan);
  canvas.addEventListener('pointercancel', endPan);

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialPinchDistance = getTouchDistance(e.touches);
      initialScaleOnPinch = canvasScale;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialPinchDistance) {
      const currentDistance = getTouchDistance(e.touches);
      const scaleFactor = currentDistance / initialPinchDistance;
      canvasScale = Math.min(2.5, Math.max(0.5, initialScaleOnPinch * scaleFactor));
      updateCanvasTransform();
    }
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      initialPinchDistance = null;
    }
  });

  canvas.addEventListener('wheel', (e) => {
    if (e.target.closest('.canvas-widget, #sidebar-dock, .modal-backdrop')) return;
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    canvasScale = Math.min(2.5, Math.max(0.5, canvasScale * zoomFactor));
    updateCanvasTransform();
  }, { passive: false });
}

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2,'0');

function updateClock() {
  const now = new Date();
  const hrs = now.getHours();
  const mins = now.getMinutes();

  const clockVal = document.getElementById('clock-time-val');
  if (clockVal) clockVal.textContent = `${pad(hrs)}:${pad(mins)}`;

  const dateVal = document.getElementById('clock-date-val');
  if (dateVal) dateVal.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${WD[now.getDay()]}`;

  updateSolarArcPosition(hrs, mins);
}

function updateSolarArcPosition(hrs, mins) {
  const dayPath = document.getElementById('day-arc-path');
  const nightPath = document.getElementById('night-arc-path');
  const indicatorGlow = document.getElementById('solar-indicator-glow');
  const indicatorCore = document.getElementById('solar-indicator-core');
  const phaseBadge = document.getElementById('solar-phase-badge');

  if (!dayPath || !nightPath || !indicatorGlow || !indicatorCore || !phaseBadge) return;

  const currentMin = hrs * 60 + mins;
  let pt = { x: 30, y: 85 };
  let isDaytime = currentMin >= 360 && currentMin < 1080;

  if (isDaytime) {
    const dayRatio = (currentMin - 360) / 720;
    const len = dayPath.getTotalLength();
    pt = dayPath.getPointAtLength(dayRatio * len);

    indicatorGlow.setAttribute('fill', '#FBBF24');
    indicatorGlow.setAttribute('opacity', '0.45');
    indicatorCore.setAttribute('fill', '#D97706');

    if (hrs >= 6 && hrs < 9) {
      phaseBadge.textContent = '🌅 清晨 (晨起食早餐) ‧ EARLY MORNING';
    } else if (hrs >= 9 && hrs < 12) {
      phaseBadge.textContent = '☀️ 上午 (日間活動) ‧ MORNING';
    } else if (hrs >= 12 && hrs < 14) {
      phaseBadge.textContent = '☀️ 正午 (午膳休息) ‧ NOON';
    } else {
      phaseBadge.textContent = '🌤️ 下午 (午後茶段) ‧ AFTERNOON';
    }
  } else {
    let nightMin = currentMin >= 1080 ? currentMin - 1080 : currentMin + 360;
    const nightRatio = nightMin / 720;
    const len = nightPath.getTotalLength();
    pt = nightPath.getPointAtLength(nightRatio * len);

    indicatorGlow.setAttribute('fill', '#60A5FA');
    indicatorGlow.setAttribute('opacity', '0.35');
    indicatorCore.setAttribute('fill', '#1D4ED8');

    if (hrs >= 18 && hrs < 21) {
      phaseBadge.textContent = '🌇 黃昏 (晚飯時間) ‧ EVENING';
    } else if (hrs >= 21 && hrs < 24) {
      phaseBadge.textContent = '🌙 深夜 (準備入睡) ‧ BEDTIME';
    } else {
      phaseBadge.textContent = '🌙 凌晨 (靜夜休息) ‧ NIGHT';
    }
  }

  indicatorGlow.setAttribute('cx', pt.x);
  indicatorGlow.setAttribute('cy', pt.y);
  indicatorCore.setAttribute('cx', pt.x);
  indicatorCore.setAttribute('cy', pt.y);
}

setInterval(updateClock, 1000);

function toggleSidebar(forceState) {
  const dock = document.getElementById('sidebar-dock');
  const backdrop = document.getElementById('sidebar-backdrop');
  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    const nextState = forceState !== undefined ? forceState : !dock.classList.contains('open');
    dock.classList.toggle('open', nextState);
    backdrop.classList.toggle('active', nextState);
  } else {
    const nextState = forceState !== undefined ? !forceState : !dock.classList.contains('collapsed');
    dock.classList.toggle('collapsed', nextState);
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast-notification');
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 2200);
}

document.getElementById('themeToggleBtn').addEventListener('click', () => {
  document.body.classList.toggle('theme-night');
  const isNight = document.body.classList.contains('theme-night');
  document.getElementById('themeToggleText').textContent = isNight ? '暖光' : '護眼';
});

window.addEventListener('DOMContentLoaded', () => {
  loadWidgetsFromStorage();
  renderAllWidgets();
  updateCanvasTransform();
  updateClock();
  initCanvasPanAndZoom();
});
</script>

</body>
</html>
